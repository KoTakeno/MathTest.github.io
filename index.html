
<!DOCTYPE html>
<html>
<head>
    <title>Online Math Test</title>
</head>
<body>

    <h1>Online Math Test</h1>
    <p>Answer the questions below.</p>

    <!-- Start of the test -->
    <form>

        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <h2>Multiple Choice Questions</h2>

        <p>1. What is 5 + 3?</p>
        <input type="radio" id="q1a" name="q1" value="6">
        <label for="q1a">6</label><br>

        <input type="radio" id="q1b" name="q1" value="8">
        <label for="q1b">8</label><br>

        <input type="radio" id="q1c" name="q1" value="10">
        <label for="q1c">10</label><br><br>

        <p>2. What is 12 &minus; 4?</p>
        <input type="radio" id="q2a" name="q2" value="6">
        <label for="q2a">6</label><br>

        <input type="radio" id="q2b" name="q2" value="8">
        <label for="q2b">8</label><br>

        <input type="radio" id="q2c" name="q2" value="9">
        <label for="q2c">9</label><br><br>

        <p>3. What is 4 &times; 3?</p>
        <input type="radio" id="q3a" name="q3" value="7">
        <label for="q3a">7</label><br>

        <input type="radio" id="q3b" name="q3" value="12">
        <label for="q3b">12</label><br>

        <input type="radio" id="q3c" name="q3" value="15">
        <label for="q3c">15</label><br><br>

        <h2>Word Problem</h2>

        <p>
            4. Alex has 15 apples and gives 6 apples to a friend.
            How many apples does Alex have left? Explain your answer.
        </p>

        <textarea name="wordProblem" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit Test">

    </form>
    <!-- End of the test -->

</body>
</html>
